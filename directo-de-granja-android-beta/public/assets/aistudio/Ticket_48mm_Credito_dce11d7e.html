<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ticket 48 mm - A crédito</title>
<!--
  ╔══════════════════════════════════════════════════════════════════╗
  ║  TICKET TÉRMICO 48 mm                             ║
  ║  (zona imprimible de impresoras de papel 58 mm = 384 puntos)     ║
  ╠══════════════════════════════════════════════════════════════════╣
  ║  USO RÁPIDO                                                      ║
  ║  1. Edita el bloque  const DATOS = {...}  (más abajo).           ║
  ║  2. Abre el archivo en el navegador y pulsa "Imprimir".          ║
  ║     - Destino: tu impresora térmica (papel 58 mm / área 48 mm)                     ║
  ║     - Márgenes: Ninguno · Escala: 100 % · Sin encabezados        ║
  ║                                                                  ║
  ║  INTEGRACIÓN EN TU APP                                           ║
  ║  El script expone  window.TicketLili  con:                       ║
  ║    calcular(datos)            → modelo con todos los cálculos    ║
  ║    renderHTML(datos)          → string HTML del ticket           ║
  ║    renderTexto(datos, opts)   → texto plano de 32 columnas       ║
  ║                                 (para ESC/POS / Bluetooth / USB) ║
  ║    aLetras(monto)             → "Cinco mil ... 00/100 M.N."      ║
  ║  También funciona en Node:  require('./ticket.js')  (copia el    ║
  ║  bloque <script> a un .js).                                      ║
  ╚══════════════════════════════════════════════════════════════════╝
-->
<style>
  /* ── Variables de impresión (se sobrescriben desde DATOS.config) ──
     --papel      : ancho de la HOJA que ve el driver.
                    48mm → el driver define la hoja de 48 mm (lo más común
                           en impresoras "58 mm" con 384 puntos).
                    58mm → el driver define 58 mm: el ticket queda centrado.
     --imprimible : zona realmente impresa (48 mm = 384 puntos a 203 dpi).
     --seguro     : margen de seguridad por lado (muchas térmicas recortan
                    el primer/último punto). Ponlo en 0mm si no lo necesitas.
     --fs         : tamaño de letra (2.35 mm ≈ 32 columnas en 46 mm). */
  :root { --papel: 48mm; --imprimible: 48mm; --seguro: 1mm; --fs: 2.35mm; }

  @page { size: 48mm 200mm; margin: 0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body {
    background: #d9dbe3; color: #000;
    font-family: 'DejaVu Sans Mono', 'Consolas', 'Courier New', monospace;
    font-size: var(--fs); line-height: 1.32;
  }

  .toolbar { display: flex; justify-content: center; gap: 8px; margin: 14px 0 10px; }
  .toolbar button {
    background: #8a4b00; color: #fff; border: 0; border-radius: 5px; padding: 9px 16px;
    font-weight: 700; font-size: 13px; cursor: pointer; font-family: system-ui, sans-serif;
  }
  .toolbar button:hover { background: #6f3c00; }

  .papel {
    width: var(--papel); margin: 0 auto 30px; background: #fff;
    padding: 3mm calc((var(--papel) - var(--imprimible)) / 2 + var(--seguro)) 8mm;
    box-shadow: 0 2px 12px rgba(0,0,0,.25);
  }
  /* Vista en pantalla: se ve más grande para revisarlo */
  @media screen { .papel { zoom: 2.2; } }
  @media print {
    body { background: #fff; }
    .toolbar { display: none; }
    .papel { box-shadow: none; margin: 0; zoom: 1; }
  }

  /* ── Contenido ── */
  .c { text-align: center; }
  .b { font-weight: 700; }
  .xl { font-size: 1.45em; font-weight: 800; letter-spacing: .02em; }
  .lg { font-size: 1.15em; font-weight: 700; }
  .sm { font-size: .88em; }
  .logo { display: block; width: 100%; height: auto; image-rendering: pixelated; margin: 0 auto 1.2mm; }
  .sep    { border: 0; border-top: .25mm dashed #000; margin: 1.6mm 0; }
  .sep.d  { border-top: .5mm solid #000; }
  .row    { display: flex; justify-content: space-between; gap: 2mm; align-items: baseline; }
  .row .v { text-align: right; white-space: nowrap; font-weight: 700; }
  .tbl    { display: grid; grid-template-columns: 7mm 1fr 1fr 1.15fr; column-gap: 1mm; }
  .tbl > div { text-align: right; }
  .tbl > div:nth-child(4n+1) { text-align: left; }
  .tbl .h { font-weight: 700; font-size: .88em; border-bottom: .25mm solid #000; padding-bottom: .6mm; margin-bottom: .6mm; }
  .tbl .n { font-weight: 700; }
  .box    { border: .5mm solid #000; padding: 1.2mm 1.6mm; margin: 1mm 0; }
  .inv    { background: #000; color: #fff; padding: .8mm 1mm; font-weight: 800; }
  .legal  { font-size: .84em; line-height: 1.28; margin-top: 1mm; }
  /* Caja de firma: 20 mm ≈ 160 puntos a 203 dpi (rango recomendado 120–180) */
  .firmabox { height: 20mm; border: .4mm solid #000; margin: 1.6mm 0 1.2mm; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .firmabox img { max-width: 100%; max-height: 100%; }
  .wrap   { overflow-wrap: anywhere; }
</style>
</head>
<body>

<div class="toolbar">

</div>

const TicketLili = (function () {
  const r2 = n => Math.round((n + Number.EPSILON) * 100) / 100;
  const money = n => n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const mxn = n => (n < 0 ? '-' : '') + '$' + money(Math.abs(n));
  const signo = n => (n >= 0 ? '+' : '-') + '$' + money(Math.abs(n));
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

  /* Número → letra (pesos mexicanos) */
  function aLetras(monto) {
    const U = ['cero','uno','dos','tres','cuatro','cinco','seis','siete','ocho','nueve','diez','once','doce','trece','catorce','quince','dieciséis','diecisiete','dieciocho','diecinueve','veinte','veintiuno','veintidós','veintitrés','veinticuatro','veinticinco','veintiséis','veintisiete','veintiocho','veintinueve'];
    const D = ['','','','treinta','cuarenta','cincuenta','sesenta','setenta','ochenta','noventa'];
    const C = ['','ciento','doscientos','trescientos','cuatrocientos','quinientos','seiscientos','setecientos','ochocientos','novecientos'];
    const m100 = n => n < 30 ? U[n] : D[Math.floor(n / 10)] + (n % 10 ? ' y ' + U[n % 10] : '');
    const m1000 = n => {
      if (n === 100) return 'cien';
      const c = Math.floor(n / 100), res = n % 100;
      return (C[c] + (c && res ? ' ' : '') + (res ? m100(res) : '')).trim();
    };
    const apocope = t => t.replace(/veintiuno$/, 'veintiún').replace(/uno$/, 'un');
    const entero = n => {
      if (n === 0) return 'cero';
      const mill = Math.floor(n / 1e6), mil = Math.floor((n % 1e6) / 1000), res = n % 1000, out = [];
      if (mill) out.push(mill === 1 ? 'un millón' : apocope(entero(mill)) + ' millones');
      if (mil) out.push(mil === 1 ? 'mil' : apocope(m1000(mil)) + ' mil');
      if (res) out.push(m1000(res));
      return out.join(' ');
    };
    const total = r2(monto), ent = Math.floor(total), cts = Math.round((total - ent) * 100);
    let txt = apocope(entero(ent));
    if (ent % 1e6 === 0 && ent > 0) txt += ' de';
    txt = txt.charAt(0).toUpperCase() + txt.slice(1);
    return txt + ' ' + (ent === 1 ? 'peso' : 'pesos') + ' ' + String(cts).padStart(2, '0') + '/100 M.N.';
  }

  /* Fecha límite de pago */
  const MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  const fmtFecha = dt => dt.getDate() + ' de ' + MESES[dt.getMonth()] + ', ' + dt.getFullYear();
  const isoALocal = t => { const p = /^(\d{4})-(\d{2})-(\d{2})$/.exec(t || ''); return p ? new Date(+p[1], +p[2] - 1, +p[3]) : null; };
  function fechaLimite(d) {
    if (d.fechaLimite) { const f = isoALocal(d.fechaLimite); return f ? fmtFecha(f) : String(d.fechaLimite); }
    const base = isoALocal(d.fechaISO) || new Date();
    base.setDate(base.getDate() + (d.plazoDias !== undefined ? d.plazoDias : 7));
    return fmtFecha(base);
  }

  /* Todos los cálculos en un solo modelo */
  function calcular(d) {
    const cajas = d.cajas.map((c, i) => {
      const tara = c.tara !== undefined ? c.tara : d.taraPorDefecto;
      return { n: i + 1, bruto: c.bruto, tara, neto: r2(c.bruto - tara) };
    });
    const sum = k => r2(cajas.reduce((a, c) => a + c[k], 0));
    const totNeto = sum('neto');
    const subtotal = r2(totNeto * d.precioPorKilo);
    const ajuste = d.redondearAlPeso ? r2(Math.round(subtotal) - subtotal) : 0;
    const total = r2(subtotal + ajuste);
    const resta = r2(total - d.pagado);
    const saldoTotal = r2(d.saldoAnterior + resta);
    // Pagado de contado = nada pendiente en esta remisión y sin saldo anterior
    const liquidado = resta <= 0 && d.saldoAnterior <= 0;
    const limite = liquidado ? null : fechaLimite(d);
    const interes = d.interesMoratorio !== undefined ? d.interesMoratorio : 3;
    const leyenda = liquidado
      ? [{ t: 'Recibí la mercancía descrita en esta remisión a mi entera satisfacción y cubrí el importe total señalado. Acepto mi firma digitalizada como constancia de recepción.' }]
      : [{ t: 'Recibí mercancía a entera satisfacción y reconozco el saldo pendiente de ' },
         { t: mxn(Math.max(resta, 0)), b: true },
         { t: ' (total adeudado: ' }, { t: mxn(saldoTotal), b: true },
         { t: '), a pagar el ' }, { t: limite, b: true },
         { t: ', con ' + interes + '% de interés moratorio mensual por retraso. Válido con firma digital.' }];
    return {
      cajas, totTara: sum('tara'), totBruto: sum('bruto'), totNeto,
      piezas: cajas.length * d.piezasPorCaja,
      subtotal, ajuste, total, resta, saldoTotal,
      liquidado, fechaLimite: limite, leyenda,
      estado: d.estado || (liquidado ? 'LIQUIDADO' : 'ENTREGADO / PENDIENTE LIQUIDACIÓN'),
      letra: aLetras(total)
    };
  }

  /* ───────── Versión HTML (impresión desde navegador / WebView) ───────── */
  function renderHTML(d) {
    const m = calcular(d), cfg = d.config || {};
    const kg = n => n.toFixed(2);
    const row = (k, v, cls) => '<div class="row ' + (cls || '') + '"><span>' + esc(k) + '</span><span class="v">' + esc(v) + '</span></div>';
    let h = '<div class="papel">';
    if (cfg.logo !== false) h += '<img class="logo" alt="H&H Huevos" src="data:image/png;base64,' + LOGO_B64 + '">';
    h += '<div class="c sm">' + esc(d.emisor.giro) + '</div>';
    h += '<div class="c sm wrap">' + esc(d.emisor.direccion) + '</div>';
    h += '<div class="c sm">Tel: ' + esc(d.emisor.telefono) + '</div>';
    h += '<div class="c sm">WhatsApp: ' + esc(d.emisor.celular) + '</div>';
    h += '<hr class="sep d">';
    h += '<div class="c lg">COMPROBANTE DE REMISIÓN</div>';
    h += '<div class="c xl">' + esc(d.folio) + '</div>';
    h += row('Fecha:', d.fecha) + row('Hora:', d.hora);
    h += '<div class="c sm b" style="margin-top:1mm">' + esc(m.estado.toUpperCase()) + '</div>';
    h += '<hr class="sep">';
    h += '<div class="b">CLIENTE</div>';
    h += '<div class="b lg wrap">' + esc(d.cliente.nombre) + '</div>';
    h += '<div class="sm wrap">Contacto: ' + esc(d.cliente.contacto) + '</div>';
    h += '<div class="sm wrap">' + esc(d.cliente.domicilio) + '</div>';
    h += '<div class="sm">Tel: ' + esc(d.cliente.telefono) + '</div>';
    h += '<hr class="sep">';
    h += '<div class="sm wrap" style="margin-bottom:1mm">' + esc(d.producto) + ' · ' + d.piezasPorCaja + ' pzas/caja</div>';
    h += '<div class="tbl"><div class="h">No.</div><div class="h">BRUTO</div><div class="h">TARA</div><div class="h">NETO kg</div>';
    m.cajas.forEach(c => {
      h += '<div class="n">' + String(c.n).padStart(2, '0') + '</div><div>' + kg(c.bruto) + '</div><div>' + kg(c.tara) + '</div><div class="b">' + kg(c.neto) + '</div>';
    });
    h += '</div>';
    h += '<hr class="sep">';
    h += row('Cajas:', String(m.cajas.length));
    h += row('Piezas:', m.piezas.toLocaleString('en-US'));
    h += row('Tara total:', kg(m.totTara) + ' kg');
    h += row('Bruto total:', kg(m.totBruto) + ' kg');
    h += '<div class="box"><div class="row lg"><span>KILOS NETOS</span><span class="v">' + kg(m.totNeto) + ' kg</span></div></div>';
    h += row('Precio por kilo:', mxn(d.precioPorKilo));
    h += row('Subtotal:', mxn(m.subtotal));
    if (m.ajuste !== 0) h += row('Redondeo:', signo(m.ajuste));
    h += '<hr class="sep d">';
    h += '<div class="row xl"><span>TOTAL</span><span class="v">' + mxn(m.total) + '</span></div>';
    h += '<div class="sm wrap" style="margin-top:1mm"><span class="b">' + esc(m.letra) + '</span></div>';
    h += '<hr class="sep d">';
    h += row('Pagado:', mxn(d.pagado));
    h += '<div class="sm">' + esc(d.metodoPago) + '</div>';
    h += '<div class="row lg inv" style="margin-top:1.2mm"><span>' + (m.resta <= 0 ? 'LIQUIDADO' : 'RESTA ENTREGA') + '</span><span>' + mxn(Math.max(m.resta, 0)) + '</span></div>';
    if (m.resta < 0) h += row('Cambio / a favor:', mxn(-m.resta));
    h += '<hr class="sep">';
    h += row('Saldo anterior:', mxn(d.saldoAnterior));
    h += row('Esta remisión:', signo(m.resta));
    h += '<div class="row lg" style="margin-top:.8mm"><span>SALDO TOTAL</span><span class="v">' + mxn(m.saldoTotal) + '</span></div>';
    if (cfg.firma !== false) {
      h += '<hr class="sep">';
      h += '<div class="legal wrap">' + m.leyenda.map(p => p.b ? '<b>' + esc(p.t) + '</b>' : esc(p.t)).join('') + '</div>';
      h += '<div class="firmabox">' + (d.firmaImg ? '<img alt="Firma" src="' + esc(d.firmaImg) + '">' : '') + '</div>';
      h += '<div class="c sm">Recibí de conformidad<br><b class="wrap">' + esc(d.cliente.contacto || d.cliente.nombre) + '</b></div>';
    }
    if (cfg.pie && cfg.pie.length) {
      h += '<hr class="sep">';
      cfg.pie.forEach((l, i) => { h += '<div class="c ' + (i === 0 ? 'b' : 'sm') + '">' + esc(l) + '</div>'; });
    }
    return h + '</div>';
  }

  /* ───────── Versión TEXTO PLANO (ESC/POS, Bluetooth, USB, etc.) ─────────
     opts.sinAcentos = true  → quita acentos (para impresoras sin CP858/UTF-8)
     Devuelve un string con saltos de línea; cada línea ≤ columnas.        */
  function renderTexto(d, opts) {
    opts = opts || {};
    const m = calcular(d), cfg = d.config || {};
    const W = cfg.columnas || 32;
    const out = [];
    const clean = s => opts.sinAcentos ? String(s).normalize('NFD').replace(/[̀-ͯ]/g, '') : String(s);
    const wrap = s => {
      const lines = []; let cur = '';
      clean(s).split(/\s+/).forEach(w => {
        while (w.length > W) { if (cur) { lines.push(cur); cur = ''; } lines.push(w.slice(0, W)); w = w.slice(W); }
        if ((cur + ' ' + w).trim().length > W) { lines.push(cur); cur = w; } else cur = (cur + ' ' + w).trim();
      });
      if (cur) lines.push(cur);
      return lines;
    };
    const left   = s => wrap(s).forEach(l => out.push(l));
    const center = s => wrap(s).forEach(l => out.push(' '.repeat(Math.floor((W - l.length) / 2)) + l));
    const lr = (l, r) => {
      l = clean(l); r = clean(r);
      if (l.length + r.length + 1 <= W) out.push(l + ' '.repeat(W - l.length - r.length) + r);
      else { out.push(l.slice(0, W)); out.push(' '.repeat(Math.max(0, W - r.length)) + r); }
    };
    const sep = ch => out.push((ch || '-').repeat(W));
    const kg = n => n.toFixed(2);

    center(d.emisor.giro);
    center(d.emisor.direccion);
    center('Tel: ' + d.emisor.telefono);
    center('WhatsApp: ' + d.emisor.celular);
    sep('=');
    center('COMPROBANTE DE REMISION');
    center(d.folio);
    lr('Fecha:', d.fecha);
    lr('Hora:', d.hora);
    center(m.estado.toUpperCase());
    sep();
    out.push('CLIENTE');
    left(d.cliente.nombre.toUpperCase());
    left('Contacto: ' + d.cliente.contacto);
    left(d.cliente.domicilio);
    left('Tel: ' + d.cliente.telefono);
    sep();
    left(d.producto + ' - ' + d.piezasPorCaja + ' pzas/caja');
    const col = (a, b, c, e) => a.padEnd(3) + b.padStart(9) + c.padStart(9) + e.padStart(W - 21);
    out.push(col('No.', 'BRUTO', 'TARA', 'NETO kg'));
    m.cajas.forEach(c => out.push(col(String(c.n).padStart(2, '0'), kg(c.bruto), kg(c.tara), kg(c.neto))));
    sep();
    lr('Cajas:', String(m.cajas.length));
    lr('Piezas:', m.piezas.toLocaleString('en-US'));
    lr('Tara total:', kg(m.totTara) + ' kg');
    lr('Bruto total:', kg(m.totBruto) + ' kg');
    lr('KILOS NETOS:', kg(m.totNeto) + ' kg');
    sep();
    lr('Precio por kilo:', mxn(d.precioPorKilo));
    lr('Subtotal:', mxn(m.subtotal));
    if (m.ajuste !== 0) lr('Redondeo:', signo(m.ajuste));
    sep('=');
    lr('TOTAL:', mxn(m.total));
    sep('=');
    left(m.letra);
    sep();
    lr('Pagado:', mxn(d.pagado));
    left(d.metodoPago);
    lr(m.resta <= 0 ? 'LIQUIDADO:' : 'RESTA ENTREGA:', mxn(Math.max(m.resta, 0)));
    if (m.resta < 0) lr('Cambio / a favor:', mxn(-m.resta));
    sep();
    lr('Saldo anterior:', mxn(d.saldoAnterior));
    lr('Esta remision:', signo(m.resta));
    lr('SALDO TOTAL:', mxn(m.saldoTotal));
    if (cfg.firma !== false) {
      sep();
      left(m.leyenda.map(p => p.t).join(''));
      for (let i = 0; i < 6; i++) out.push('');      // espacio de firma (~6 líneas ≈ 144 puntos)
      sep();
      center('Recibi de conformidad');
      center(d.cliente.contacto || d.cliente.nombre);
    }
    if (cfg.pie && cfg.pie.length) { sep(); cfg.pie.forEach(center); }
    return out.join('\n') + '\n';
  }

  return { calcular, renderHTML, renderTexto, aLetras };
})();

/* Navegador: pinta el ticket en #ticket. Node/app: se exporta el módulo. */
if (typeof document !== 'undefined' && document.getElementById('ticket')) {
  const cfgp = DATOS.config || {};
  document.documentElement.style.setProperty('--papel', (cfgp.anchoPapel || 48) + 'mm');
  document.documentElement.style.setProperty('--imprimible', (cfgp.anchoImprimible || 48) + 'mm');
  document.getElementById('ticket').innerHTML = TicketLili.renderHTML(DATOS);
  document.title = 'Ticket ' + DATOS.folio;
  window.TicketLili = TicketLili;

  /* Chromium no entiende "@page { size: 48mm auto }", así que se mide el alto
     real del ticket y se fija una hoja de ancho × alto exacto (sin hojas en blanco). */
  const ajustarPagina = function () {
    const papel = document.querySelector('.papel');
    if (!papel) return;
    const z = papel.style.zoom;
    papel.style.zoom = '1';
    const mm = Math.ceil(papel.getBoundingClientRect().height * 25.4 / 96) + 1;
    papel.style.zoom = z;
    let st = document.getElementById('pagina-ticket');
    if (!st) { st = document.createElement('style'); st.id = 'pagina-ticket'; document.head.appendChild(st); }
    st.textContent = '@page { size: ' + (cfgp.anchoPapel || 48) + 'mm ' + mm + 'mm; margin: 0; }';
  };
  ajustarPagina();
  window.addEventListener('beforeprint', ajustarPagina);
  window.TicketLili.ajustarPagina = ajustarPagina;
}
if (typeof module !== 'undefined') module.exports = { TicketLili, DATOS };
</script>
