<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Error</title></head><body><style>body{margin:0}
.r{position:relative;width:960px;height:600px;overflow:hidden;background:#EEF1F5;font-family:"Segoe UI",Arial,sans-serif}
.cd{position:absolute;left:330px;top:150px;width:300px;box-sizing:border-box;padding:28px 24px 24px;border-radius:18px;background:#0a141e;border:1px solid #1B2B3C;box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 3px 0 #050b11,0 24px 56px rgba(0,0,0,.55);text-align:center}
h2{margin:14px 0 0;font-size:19px;color:#CFE0FA}
.bt{font:600 14px "Segoe UI",Arial,sans-serif;padding:11px 22px;margin:18px 5px 0;border-radius:10px;border:1px solid #0F3D7A;border-bottom-width:3px;color:#fff;background:linear-gradient(#3A7BD5,#1E5FBF);box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.bt.g{color:#E6EDF5;border-color:#3A4C60;background:linear-gradient(#2B3C4F,#1B2836)}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.egg{transform-origin:60px 140px;animation:shk .7s ease-in-out 2}
@keyframes shk{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px) rotate(-3deg)}40%{transform:translateX(5px) rotate(3deg)}60%{transform:translateX(-4px) rotate(-2deg)}80%{transform:translateX(3px) rotate(1deg)}}
.bd{transform-origin:98px 118px;transform:scale(0);animation:pop .4s .5s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes pop{to{transform:scale(1)}}</style>
<div class="r"><div class="cd">
<svg width="132" height="170" viewBox="0 0 120 150" role="img" aria-label="Huevo roto con aviso de error"><ellipse cx="60" cy="146" rx="34" ry="5" fill="#fff" opacity=".07"/>
<g class="egg"><path d="M60 6C90 6 112 58 112 92C112 124 90 144 60 144C30 144 8 124 8 92C8 58 30 6 60 6Z" fill="#fff" stroke="#5B9BEA" stroke-width="4"/>
<path d="M40 44L52 62L42 76L58 92L48 108L60 124" fill="none" stroke="#D64545" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M58 92L76 86" fill="none" stroke="#D64545" stroke-width="3" stroke-linecap="round"/></g>
<g class="bd"><circle cx="98" cy="118" r="17" fill="#D64545" stroke="#fff" stroke-width="3"/><path d="M98 108V120" stroke="#fff" stroke-width="4" stroke-linecap="round"/><circle cx="98" cy="127" r="2.4" fill="#fff"/></g></svg>
<h2 style="color:#FF7A7A">cancelando mis huevitos</h2>
</div></div>
</body></html>
