<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Éxito</title></head><body><style>body{margin:0}
.r{position:relative;width:960px;height:600px;overflow:hidden;background:#EEF1F5;font-family:"Segoe UI",Arial,sans-serif}
.cd{position:absolute;left:330px;top:150px;width:300px;box-sizing:border-box;padding:28px 24px 24px;border-radius:18px;background:#0a141e;border:1px solid #1B2B3C;box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 3px 0 #050b11,0 24px 56px rgba(0,0,0,.55);text-align:center}
h2{margin:14px 0 0;font-size:19px;color:#CFE0FA}
.bt{font:600 14px "Segoe UI",Arial,sans-serif;padding:11px 22px;margin:18px 5px 0;border-radius:10px;border:1px solid #0F3D7A;border-bottom-width:3px;color:#fff;background:linear-gradient(#3A7BD5,#1E5FBF);box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.bt.g{color:#E6EDF5;border-color:#3A4C60;background:linear-gradient(#2B3C4F,#1B2836)}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.top{transform-origin:100px 76px;animation:op .9s .2s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes op{to{transform:translate(-24px,-34px) rotate(-34deg)}}
.chk{transform-origin:60px 108px;transform:scale(0);animation:pop .5s .6s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes pop{to{transform:scale(1)}}
.msg{opacity:0;animation:fi .5s 1s forwards}
@keyframes fi{to{opacity:1}}</style>
<div class="r"><div class="cd">
<svg width="132" height="170" viewBox="0 0 120 150" role="img" aria-label="Huevo abierto con palomita verde"><defs>

<clipPath id="t"><polygon points="0,0 120,0 120,78 100,70 84,82 66,70 50,82 34,70 18,82 0,74"/></clipPath>
<clipPath id="b"><polygon points="0,74 18,82 34,70 50,82 66,70 84,82 100,70 120,78 120,150 0,150"/></clipPath></defs>
<ellipse cx="60" cy="146" rx="34" ry="5" fill="#fff" opacity=".07"/>
<g clip-path="url(#b)"><path d="M60 6C90 6 112 58 112 92C112 124 90 144 60 144C30 144 8 124 8 92C8 58 30 6 60 6Z" fill="#E4F5EB" stroke="#5B9BEA" stroke-width="4"/></g>
<g clip-path="url(#e)"><polyline points="0,74 18,82 34,70 50,82 66,70 84,82 100,70 120,78" fill="none" stroke="#0F3D7A" stroke-width="3" stroke-linejoin="round"/></g>
<g class="chk"><circle cx="60" cy="108" r="24" fill="#2E9B5B"/><path d="M48 108L57 117L74 97" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g>
<g class="top"><g clip-path="url(#t)"><path d="M60 6C90 6 112 58 112 92C112 124 90 144 60 144C30 144 8 124 8 92C8 58 30 6 60 6Z" fill="#fff" stroke="#5B9BEA" stroke-width="4"/></g>
<g clip-path="url(#e)"><polyline points="0,74 18,82 34,70 50,82 66,70 84,82 100,70 120,78" fill="none" stroke="#0F3D7A" stroke-width="3" stroke-linejoin="round"/></g></g></svg>

</div></div>
